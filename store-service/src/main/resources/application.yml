server:
  port: 8082

spring:
  application:
    name: store-service
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: store-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "common.event"
        spring.json.value.default.type: "common.event.OrderEvent"
  profiles:
    default: dev
    group:
      dev:  [pgsql-dev,  jwt-dev,  hmac-dev,  cache-dev]
      test: [pgsql-test, jwt-test, hmac-test]
      prod: [pgsql-prod, jwt-prod, hmac-prod, cache-prod]
  config:
    import:
      - "pgsql.yaml"
      - "jwt.yaml"
      - "hmac.yaml"
      - "cache.yaml"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true