apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: baemin
  labels:
    app: order-service
    {{- include "baemin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.orderReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    {{- include "baemin.rollingUpdate" . | nindent 4 }}
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        {{- include "baemin.prometheusAnnotations" "8083" | nindent 8 }}
    spec:
      containers:
        - name: order-service
          image: "{{ .Values.images.registry }}/order-service:{{ .Values.images.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_PORT
            {{- include "baemin.backendEnv" (dict
                  "service" "order"
                  "dbKey"   "ORDER_DB_URL"
                  "hmacKey" "BFF_HMAC_ORDER_SECRET"
                  "javaOpts" .Values.javaOpts) | nindent 12 }}

          {{- include "baemin.probes" 8083 | nindent 10 }}