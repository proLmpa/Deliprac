apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: baemin
  labels:
    app: user-service
    {{- include "baemin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.userReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    {{- include "baemin.rollingUpdate" . | nindent 4 }}
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        {{- include "baemin.prometheusAnnotations" "8081" | nindent 8 }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.images.registry }}/user-service:{{ .Values.images.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            {{- include "baemin.backendEnv" (dict
              "service" "user"
              "dbKey"   "USER_DB_URL"
              "hmacKey" "BFF_HMAC_USER_SECRET"
              "javaOpts" .Values.javaOpts) | nindent 12 }}

          {{- include "baemin.probes" 8081 | nindent 10 }}