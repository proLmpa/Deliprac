apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: baemin
  labels:
    app: notification-service
    {{- include "baemin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: {{ .Values.notificationReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    {{- include "baemin.rollingUpdate" . | nindent 4 }}
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        {{- include "baemin.prometheusAnnotations" "8084" | nindent 8 }}
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.images.registry }}/notification-service:{{ .Values.images.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_PORT
            {{- include "baemin.backendEnv" (dict
                  "service" "notification"
                  "dbKey"   "NOTIF_DB_URL"
                  "hmacKey" "BFF_HMAC_NOTIF_SECRET"
                  "javaOpts" .Values.javaOpts) | nindent 12 }}

          {{- include "baemin.probes" 8084 | nindent 10 }}