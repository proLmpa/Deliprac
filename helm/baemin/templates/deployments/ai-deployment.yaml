apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: baemin
  labels:
    app: ai-service
    {{- include "baemin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: {{ .Values.aiReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ai-service
  strategy:
    {{- include "baemin.rollingUpdate" . | nindent 4 }}
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        {{- include "baemin.prometheusAnnotations" "8085" | nindent 8 }}
    spec:
      containers:
        - name: ai-service
          image: "{{ .Values.images.registry }}/ai-service:{{ .Values.images.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: STORE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-urls
                  key: STORE_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-urls
                  key: ORDER_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: common-secret
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: ANTHROPIC_API_KEY
            - name: BFF_HMAC_AI_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: BFF_HMAC_AI_SECRET
            - name: BFF_HMAC_STORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bff-secret
                  key: BFF_HMAC_STORE_SECRET
            - name: BFF_HMAC_ORDER_SECRET
              valueFrom:
                secretKeyRef:
                  name: bff-secret
                  key: BFF_HMAC_ORDER_SECRET
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}

          {{- include "baemin.probes" 8085 | nindent 10 }}