apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-service
  namespace: baemin
  labels:
    app: store-service
    {{- include "baemin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.storeReplicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: store-service
  strategy:
    {{- include "baemin.rollingUpdate" . | nindent 4 }}
  template:
    metadata:
      labels:
        app: store-service
      annotations:
        {{- include "baemin.prometheusAnnotations" "8082" | nindent 8 }}
    spec:
      containers:
        - name: store-service
          image: "{{ .Values.images.registry }}/store-service:{{ .Values.images.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_PORT
            {{- include "baemin.backendEnv" (dict
                  "service" "store"
                  "dbKey"   "STORE_DB_URL"
                  "hmacKey" "BFF_HMAC_STORE_SECRET"
                  "javaOpts" .Values.javaOpts) | nindent 12 }}

          {{- include "baemin.probes" 8082 | nindent 10 }}