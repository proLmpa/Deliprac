apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: baemin
type: Opaque
stringData:
  ANTHROPIC_API_KEY:     {{ .Values.secrets.anthropicKey | quote }}
  BFF_HMAC_AI_SECRET:    {{ .Values.secrets.hmacAi       | quote }}
  BFF_HMAC_STORE_SECRET: {{ .Values.secrets.hmacStore    | quote }}
  BFF_HMAC_ORDER_SECRET: {{ .Values.secrets.hmacOrder    | quote }}
