apiVersion: v1
kind: Secret
metadata:
  name: bff-secret
  namespace: baemin
type: Opaque
stringData:
  BFF_HMAC_USER_SECRET:  {{ .Values.secrets.hmacUser  | quote }}
  BFF_HMAC_STORE_SECRET: {{ .Values.secrets.hmacStore | quote }}
  BFF_HMAC_ORDER_SECRET: {{ .Values.secrets.hmacOrder | quote }}
  BFF_HMAC_NOTIF_SECRET: {{ .Values.secrets.hmacNotif | quote }}
  BFF_HMAC_AI_SECRET:    {{ .Values.secrets.hmacAi    | quote }}
