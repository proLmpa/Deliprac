# Kafka access policy.
#
# CALL GRAPH:
#   order-service      → baemin-kafka:9092  (producer: publishes OrderEvent)
#   store-service      → baemin-kafka:9092  (consumer: reads ORDER_SOLD)
#   notification-service → baemin-kafka:9092 (consumer: reads all events)
#
# Note the app label on the Kafka StatefulSet is "baemin-kafka"
# (from helm/kafka/templates/statefulset.yaml metadata.labels).
# Verify with: kubectl get pods -n baemin -l app=baemin-kafka

---
# Ingress to Kafka from the three services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-access
  namespace: baemin
spec:
  podSelector:
    matchLabels:
      app: baemin-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: store-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 9092
          protocol: TCP
---
# Egress from each consumer/producer to Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-producer-egress
  namespace: baemin
spec:
  podSelector:
    matchLabels:
      app: order-service    # producer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: baemin-kafka
      ports:
        - port: 9092
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-consumer-egress-store
  namespace: baemin
spec:
  podSelector:
    matchLabels:
      app: store-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: baemin-kafka
      ports:
        - port: 9092
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-consumer-egress-notification
  namespace: baemin
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: baemin-kafka
      ports:
        - port: 9092
          protocol: TCP
