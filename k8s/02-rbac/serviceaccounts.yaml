# One ServiceAccount per workload.
# Spring Boot services NEVER call the K8s API — so automount is false.
# This prevents a compromised container from using the mounted JWT to enumerate
# cluster state or escalate via RBAC.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: baemin
  # Explanation: a ServiceAccount is just a named identity in a namespace.
  # K8s mints a signed JWT for it and (by default) mounts it into every pod
  # at /var/run/secrets/kubernetes.io/serviceaccount/token.
  # With automountServiceAccountToken: false, that file is never created.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-service
  namespace: baemin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-service
  namespace: baemin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: baemin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: baemin
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: front-service
  namespace: baemin
automountServiceAccountToken: false
---
# Prometheus Agent DOES need to call the K8s API — it uses pod autodiscovery.
# It gets a ServiceAccount WITH a token, but only minimal read permissions (see roles.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: baemin
automountServiceAccountToken: true   # prometheus-agent needs this to call K8s API
