# PodDisruptionBudget (PDB) — guarantees minimum availability during VOLUNTARY disruptions.
#
# VOLUNTARY DISRUPTIONS:
#   - kubectl drain node (before maintenance)
#   - kubectl cordon + rolling deployment
#   - Cluster autoscaler scaling down
#
# INVOLUNTARY DISRUPTIONS (PDB does NOT protect against):
#   - Hardware failure
#   - Pod OOMKill
#   - Node kernel panic
#
# CRITICAL PITFALL WITH SINGLE-REPLICA SERVICES:
#   If replicas: 1 and minAvailable: 1 → kubectl drain BLOCKS FOREVER.
#   The node cannot be drained because it would violate the PDB.
#   Solution: either use minAvailable: 0 (meaningless but non-blocking)
#             or scale to 2 replicas before applying PDB with minAvailable: 1.
#
# For this learning exercise, we use maxUnavailable: 1 which allows 0 available
# when replicas=1 (all can be disrupted), but ensures at least 0 running.
# This is essentially a documentation stub showing intent for when you scale up.

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff-service-pdb
  namespace: baemin
spec:
  # With replicas:1, maxUnavailable:1 means "allow 1 pod to be disrupted at a time"
  # which allows the single pod to be disrupted (not strictly protective).
  # Scale bff-service to 2 replicas + change to minAvailable:1 for real protection.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: bff-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: baemin
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: user-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-service-pdb
  namespace: baemin
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: store-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: baemin
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
