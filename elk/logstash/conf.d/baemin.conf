input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "spring"
      skip_on_invalid_json => true
    }
  }

  if [spring][level] {
    date {
      match   => ["[spring][@timestamp]", "ISO8601"]
      target  => "@timestamp"
      timezone => "UTC"
    }

    # Drop Filebeat's ECS "event" object before renaming our audit event string.
    # Without this, "event" maps as both object (ECS) and keyword (audit) → conflict.
    mutate {
      remove_field => ["event"]
    }

    mutate {
      rename => {
        "[spring][message]"     => "message"
        "[spring][level]"       => "level"
        "[spring][logger_name]" => "logger"
        "[spring][traceId]"     => "traceId"
        "[spring][service]"     => "service"
        "[spring][stack_trace]" => "stackTrace"
        # Audit fields
        "[spring][event]"       => "event"
        "[spring][userId]"      => "userId"
        "[spring][storeId]"     => "storeId"
        "[spring][orderId]"     => "orderId"
        "[spring][reviewId]"    => "reviewId"
        "[spring][rating]"      => "rating"
        "[spring][totalPrice]"  => "totalPrice"
        "[spring][count]"       => "count"
        "[spring][branch]"      => "branch"
        "[spring][role]"        => "role"
      }
      remove_field => ["spring", "log", "input", "agent", "ecs", "[spring][thread_name]"]
    }
  }

  if ![service] or [service] == "unknown" {
    if [kubernetes][container][name] {
      mutate { replace => { "service" => "%{[kubernetes][container][name]}" } }
    } else if ![service] {
      mutate { add_field => { "service" => "unknown" } }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://localhost:9200"]
    user     => "logstash_writer"
    password => "${LOGSTASH_ES_PASSWORD}"
    index    => "baemin-%{service}-%{+YYYY.MM.dd}"
    action   => "index"
  }
}
